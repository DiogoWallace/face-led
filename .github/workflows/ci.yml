name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  servico:
    name: Serviço (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facial-validation-service
    # Valores fictícios: a suíte sem infraestrutura usa dublês em memória e nunca
    # conecta em nada. Integração, modelos ONNX e LFW ficam de fora porque exigem
    # PostgreSQL, Redis, S3, os modelos ou o dataset (ver os marcadores no pyproject).
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      TEMPLATE_ENCRYPTION_KEY: ci-somente-para-teste
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facial-validation-service/requirements/*.lock
      - name: Instalar dependências (os mesmos locks da imagem)
        run: pip install --require-hashes -r requirements/runtime.lock -r requirements/dev.lock
      - name: Ruff
        run: ruff check app tests migrations evaluation
      - name: Pytest
        run: pytest -m "not integration and not biometric and not models and not evaluation"

  ponte:
    name: Ponte (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-led/bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: face-led/bridge/uv.lock
      - name: Instalar dependências
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest (porta serial falsa, sem hardware)
        run: uv run pytest

  firmware:
    name: Firmware (compila para o Uno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1
      - name: Compilar com o core fixado no sketch.yaml
        working-directory: face-led/firmware/face_led
        run: arduino-cli compile --profile uno .
