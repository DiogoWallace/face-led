[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-validation-service"
version = "0.1.0"
description = "Microserviço centralizado de cadastro e validação facial 1:1."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",
    "arq>=0.26,<0.27",
    "boto3>=1.35,<2",
    "cryptography>=43",
    # Cliente do webhook de resultado (ADR-009).
    "httpx>=0.28,<1",
    # Motor biométrico OpenCV (YuNet + SFace): mesma série validada no POC (ADR-003).
    "opencv-python-headless>=4.14,<5",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "ruff>=0.8",
]
# Instalado apenas quando a observabilidade for ativada (ver docs/architecture.md).
otel = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: exige PostgreSQL, Redis e storage S3 reais (compose)",
    "biometric: exige um motor biométrico real e dataset de avaliação",
    "models: exige os modelos ONNX em BIOMETRIC_MODELS_DIR (python -m app.cli download-models)",
    "evaluation: avaliação com dataset externo (LFW); lenta, fora da suíte padrão (make evaluate)",
]
# A avaliação é lenta e depende de dataset externo: só roda com -m evaluation.
addopts = "-ra --strict-markers -m 'not evaluation'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
